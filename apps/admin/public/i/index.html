<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f0d4" />
    <!--
      Une URL par pseudo, toutes servies par ce même fichier : il n'y a rien à
      indexer, et laisser un moteur collecter les handles de la base ferait de
      ce site l'annuaire que docs/prd.md §4.1 refuse d'être.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="On t'invite sur StatOwrel — une question par jour, la même pour tout le monde."
    />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="StatOwrel" />
    <meta property="og:title" content="Rejoins-moi sur StatOwrel." />
    <meta
      property="og:description"
      content="Une question par jour, la même pour tout le monde. Deux taps pour être honnête, et la stat s'ouvre."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Rejoins-moi sur StatOwrel." />
    <meta
      name="twitter:description"
      content="Une question par jour, la même pour tout le monde. Deux taps pour être honnête, et la stat s'ouvre."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://api.dicebear.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Rejoins-moi sur StatOwrel</title>
    <style>
      /*
       * La page d'atterrissage du parrainage (docs/prd.md §4.9) porte sa propre
       * copie des tokens, comme la page de présentation et public/legal/ : elle
       * n'a pas de bundle, c'est un fichier servi tel quel. Les valeurs viennent
       * de apps/app/src/design/tokens.ts — toute divergence est un bug.
       */
      :root {
        --background: #f7f0d4;
        --foreground: #000000;
        --card: #ffffff;
        --muted-foreground: #6b6355;
        --primary: #ffdc59;
        --secondary: #000000;
        --secondary-foreground: #ffffff;
        --accent: #d04060;
        --border-width: 2px;
        --radius-sm: 8px;
        --radius: 12px;
        --shadow: 4px 4px 0 0 var(--foreground);
        --shadow-lg: 6px 6px 0 0 var(--foreground);
        --font-head: 'Archivo Black', system-ui, sans-serif;
        --font-sans: 'Space Grotesk', system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        background: var(--background);
        color: var(--foreground);
        display: flex;
        font-family: var(--font-sans);
        font-size: 16px;
        justify-content: center;
        line-height: 1.5;
        margin: 0;
        min-height: 100vh;
        padding: 32px 20px;
      }

      main {
        max-width: 380px;
        text-align: center;
        width: 100%;
      }

      a:focus-visible,
      button:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }

      .brand {
        align-items: center;
        color: var(--foreground);
        display: inline-flex;
        font-family: var(--font-head);
        font-size: 16px;
        gap: 8px;
        margin-bottom: 40px;
        text-decoration: none;
      }

      .brand svg {
        display: block;
        height: 20px;
        width: 20px;
      }

      /*
       * La même face que dans l'app : un « patchwork » DiceBear semé sur le
       * handle, avec la palette de src/lib/avatars.ts. Semé et non stocké, donc
       * l'URL se dérive du pseudo des deux côtés sans que rien ne soit copié.
       * Décorative — `alt` vide — parce que le pseudo est écrit juste dessous :
       * un texte de remplacement le dirait deux fois, et déborderait du cadre le
       * jour où l'image ne charge pas. Le carré jaune est le repli, une forme
       * plutôt qu'un trou.
       */
      .avatar {
        background: var(--primary);
        border: var(--border-width) solid var(--foreground);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        display: block;
        height: 88px;
        margin: 0 auto 20px;
        object-fit: cover;
        width: 88px;
      }

      h1 {
        font-family: var(--font-head);
        font-size: 26px;
        line-height: 1.2;
        margin: 0;
        text-transform: uppercase;
      }

      /* Le pseudo n'est dit qu'une fois, ici, et c'est aussi ce qui se copie. */
      .handle {
        display: block;
        overflow-wrap: anywhere;
      }

      p {
        color: var(--muted-foreground);
        margin: 16px 0 0;
      }

      .reward {
        color: var(--foreground);
        font-weight: 700;
        white-space: nowrap;
      }

      .copy-button {
        background: var(--card);
        border: var(--border-width) solid var(--foreground);
        border-radius: var(--radius-sm);
        box-shadow: 3px 3px 0 0 var(--foreground);
        color: var(--foreground);
        cursor: pointer;
        font-family: var(--font-sans);
        font-size: 14px;
        font-weight: 700;
        margin-top: 16px;
        padding: 8px 16px;
      }

      .copy-button:hover {
        background: var(--primary);
      }

      .copy-button:active {
        box-shadow: 0 0 0 0 var(--foreground);
        transform: translate(3px, 3px);
      }

      .stores {
        display: flex;
        flex-direction: column;
        gap: 12px;
        list-style: none;
        margin: 40px 0 0;
        padding: 0;
      }

      .store-button {
        align-items: center;
        background: var(--secondary);
        border: var(--border-width) solid var(--foreground);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        color: var(--secondary-foreground);
        display: flex;
        gap: 12px;
        justify-content: center;
        padding: 10px 20px;
        text-decoration: none;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }

      .store-button:hover {
        box-shadow: var(--shadow-lg);
        transform: translate(-2px, -2px);
      }

      .store-button:active {
        box-shadow: 0 0 0 0 var(--foreground);
        transform: translate(4px, 4px);
      }

      .store-button svg {
        display: block;
        fill: currentColor;
        flex-shrink: 0;
        height: 24px;
        width: 24px;
      }

      .store-name {
        font-family: var(--font-head);
        font-size: 16px;
      }

      footer {
        color: var(--muted-foreground);
        font-size: 13px;
        margin-top: 40px;
      }

      footer a {
        color: var(--muted-foreground);
      }

      /*
       * Deux pages en une, et c'est l'attribut sur <body> qui tranche : un lien
       * peut arriver sans pseudo (/i tout court) ou avec un pseudo qui n'a pas
       * la forme d'un handle. Nommer un parrain qui n'existe pas serait pire que
       * ne nommer personne, donc la page tombe sur une invitation ordinaire.
       */
      body:not([data-referrer='named']) .named-only {
        display: none;
      }

      body[data-referrer='named'] .anonymous-only {
        display: none;
      }
    </style>
  </head>
  <body data-referrer="anonymous">
    <main>
      <a class="brand" href="/">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 1.6l3.09 6.26 6.91 1-5 4.87 1.18 6.87L12 17.35l-6.18 3.25L7 13.73l-5-4.87 6.91-1L12 1.6z"
            fill="#ffdc59"
            stroke="#000"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
        </svg>
        StatOwrel
      </a>

      <!-- alt vide : décorative, le pseudo est juste dessous. -->
      <img class="avatar named-only" id="avatar" alt="" src="" />

      <h1>
        <span class="named-only">
          <span class="handle" id="handle"></span>
          t'invite sur StatOwrel
        </span>
        <span class="anonymous-only">On t'invite sur StatOwrel</span>
      </h1>

      <p class="named-only">
        Mets son pseudo dans « Qui t'a fait venir ? » à l'inscription :
        tu gagnes <span class="reward">10 StatFlouzz</span>.
      </p>

      <p class="anonymous-only">Une question par jour, la même pour tout le monde.</p>

      <button class="copy-button named-only" id="copy-button" type="button">Copier le pseudo</button>

      <ul class="stores">
        <li>
          <a
            class="store-button"
            href="https://apps.apple.com/fr/app/statowrel/id6803561031"
            aria-label="Télécharger StatOwrel sur l'App Store"
          >
            <svg viewBox="0 0 384 512" aria-hidden="true">
              <path
                d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"
              />
            </svg>
            <span class="store-name">App Store</span>
          </a>
        </li>
        <li>
          <a
            class="store-button"
            href="https://play.google.com/store/apps/details?id=fr.quentinmachard.statowrel&amp;hl=fr"
            aria-label="Télécharger StatOwrel sur Google Play"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M22.018 13.298l-3.919 2.218-3.515-3.493 3.543-3.521 3.891 2.202a1.49 1.49 0 0 1 0 2.594zM1.337.924a1.486 1.486 0 0 0-.112.568v21.017c0 .217.045.419.124.6l11.155-11.087zm12.207 10.065l3.258-3.238L3.45.195a1.466 1.466 0 0 0-.946-.179zm0 2.067l-11 10.933c.298.036.612-.016.906-.183l13.324-7.54z"
              />
            </svg>
            <span class="store-name">Google Play</span>
          </a>
        </li>
      </ul>

      <footer>
        <a href="/legal/cgu">CGU</a> · <a href="/legal/confidentialite">Confidentialité</a> ·
        <a href="/legal/mentions-legales">Mentions légales</a>
      </footer>
    </main>

    <script>
      (function () {
        /*
         * La même forme que USERNAME_PATTERN de packages/models/src/v1_username.ts,
         * recopiée : cette page n'a pas de bundle, donc pas d'import. Elle ne
         * décide de rien — l'app revérifie le handle contre v1_usernames à
         * l'inscription — elle décide seulement s'il y a un nom à afficher.
         */
        var PATTERN = /^[a-z0-9][a-z0-9._]{1,18}[a-z0-9]$/;

        /* La palette et le style de apps/app/src/lib/avatars.ts, à l'identique. */
        var AVATAR = 'https://api.dicebear.com/10.x/patchwork/svg'
          + '?backgroundColor=F7F0D4'
          + '&fabricAColor=69D3E8,7FBC8C'
          + '&fabricBColor=E2A017,FF68B5'
          + '&fabricCColor=FF68B5,9723C9'
          + '&seed=';

        var raw = '';

        try {
          raw = decodeURIComponent(window.location.pathname.replace(/^\/i\/?/, ''));
        } catch (error) {
          // Un pourcentage isolé dans l'URL fait jeter decodeURIComponent. Ce
          // n'est pas un handle, donc c'est la page anonyme.
          raw = '';
        }

        var handle = raw.trim().toLowerCase().replace(/^@/, '').replace(/\/.*$/, '');

        if (!PATTERN.test(handle)) {
          return;
        }

        /*
         * `textContent` et jamais `innerHTML` : ce segment d'URL vient du monde
         * extérieur. Le motif ci-dessus interdit déjà tout ce qui pourrait être
         * du balisage, mais c'est la règle qui protège, pas la validation.
         */
        document.getElementById('handle').textContent = '@' + handle;

        var avatar = document.getElementById('avatar');

        avatar.src = AVATAR + encodeURIComponent(handle);

        document.body.setAttribute('data-referrer', 'named');

        var button = document.getElementById('copy-button');

        button.addEventListener('click', function () {
          /*
           * Une copie sur clic, jamais au chargement : tous les navigateurs
           * refusent l'écriture du presse-papier sans geste utilisateur. Et
           * l'app, elle, ne *lit* jamais le presse-papier — sur iOS 16+ ça
           * déclenche la bannière système de collage, payée par toutes les
           * inscriptions pour servir celles qui viennent d'un lien.
           */
          if (!navigator.clipboard) {
            button.textContent = 'Copie impossible ici';

            return;
          }

          navigator.clipboard.writeText(handle).then(
            function () {
              button.textContent = 'Copié';
            },
            function () {
              button.textContent = 'Copie impossible ici';
            },
          );
        });
      })();
    </script>
  </body>
</html>

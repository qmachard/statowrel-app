<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The launch screen's star: the same mark as `icon.svg`, but framed the way
    `assets/lottie/star.json` frames it — its own 512x512 canvas, doubled, with
    nothing recentred.

    That framing is the whole point. The animation opens on the star already in
    place (it winks and wobbles rather than flying in), so the native splash can
    hold this still one, and `src/splash/Splash.tsx` can take over at the same
    size and the same place: the handover has nothing to show.

    The PNG beside it is this file rasterised at 1024x1024 — regenerate it from
    here whenever the mark changes, and keep both in step.
  -->
  <g transform="scale(2.0)" stroke="#000000" stroke-width="12.0" stroke-linejoin="round" stroke-linecap="round">
